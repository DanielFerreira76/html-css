<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páguna 04</title>
    <style>
        body {
            background-color: coral;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        h1 {
            font-weight: 900;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Scripts</h1>
    <a href="#" onclick="clicar()">Clique aqui</a>
    <div id="div"></div>
    <script>
        function clicar() {
            var s = document.getElementById("div")
            s.innerHTML += "<p>Você clicou!</p>"            
        }
    </script>
</body>
</html>
