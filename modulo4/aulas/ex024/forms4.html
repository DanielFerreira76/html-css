<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>E-mails e Telefones em Formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" required minlength="3" maxlength="50" autocomplete="name">
            </p>
            <p>
                <label for="email">E-mail: </label>
                <input type="email" name="email" id="email" required autocomplete="email">
            </p>
            <p>
                <label for="telefone">Telefone: </label>
                <input type="tel" name="telefone" id="telefone" required pattern="^\(\d{2}\) \d{4, 5}-\d{4}$" placeholder="(xx) xxxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
