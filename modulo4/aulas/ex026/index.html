<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaquery.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section>
                <div id="img">
                    
                </div>
                <div id="form">
                    <h1>Login</h1>
                    <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                    <form method="post" action="cad.php" autocomplete="on">
                        <div class="campo">
                            <span class="material-symbols-outlined">person</span>
                            <input type="email" name="email" id="email" placeholder="Seu E-mail" autocomplete="email" required maxlength="20">
                            <label for="email">E-mail</label>
                        </div>
                        <div class="campo">
                            <span class="material-symbols-outlined">key</span>
                            <input type="password" name="senha" id="senha" placeholder="Sua Senha" autocomplete="current-password" required minlength="8" maxlength="25">
                            <label for="senha">Senha</label>
                        </div>
                        <input type="submit" value="Entrar">
                        <a href="#">
                            Esquici a senha
                            <span class="material-symbols-outlined">mail</span>
                        </a>
                    </form>
                </div>
        </section>
    </main>
</body>
</html>
